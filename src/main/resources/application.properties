spring.application.name=login-register

# ---------------------------------------------------------------
# MySQL connection
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/login_register?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update creates the "users" table automatically
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=8080